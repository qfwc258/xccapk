# Gradle 基本配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------- Release 签名配置 ----------
# 本地编译时直接从这里读取；CI 构建会被 GitHub Actions 的 -Prelease.* 参数覆盖
# 上传到 GitHub 时务必把本文件加入 .gitignore，或使用 git update-index --skip-worktree
RELEASE_STORE_FILE=signing/release.keystore
RELEASE_STORE_PASSWORD=xcctv2026
RELEASE_KEY_ALIAS=xcctv
RELEASE_KEY_PASSWORD=xcctv2026
