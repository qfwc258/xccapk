name: Build APK

on:
  push:
    branches: [xcctvhelper]
    tags: ['v*']
    paths-ignore:
      - 'tv/**' # 忽略 tv 文件夹下所有文件改动，仅tv变更不会触发push构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.extract_version.outputs.version }}
      apk_path: ${{ steps.find_apk.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew exec
        run: chmod +x ./gradlew

      - name: Extract versionName
        id: extract_version
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 基础版本: $VER"

      - name: Assemble Release
        run: |
          STK="${{ secrets.RELEASE_STORE_PASSWORD || 'xcctv2026' }}"
          KAL="${{ secrets.RELEASE_KEY_ALIAS || 'xcctv' }}"
          KPW="${{ secrets.RELEASE_KEY_PASSWORD || 'xcctv2026' }}"
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=signing/release.keystore \
            -PRELEASE_STORE_PASSWORD="$STK" \
            -PRELEASE_KEY_ALIAS="$KAL" \
            -PRELEASE_KEY_PASSWORD="$KPW"

      - name: List outputs
        run: find app/build/outputs -name '*.apk' -type f -ls

      - name: Find APK path
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCCTV-TVHelper-release
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 30

      # ========== 新增：打包源码压缩包，剔除 tv 文件夹 ==========
      - name: Package source zip (exclude tv folder)
        id: package_src
        run: |
          VER="${{ steps.extract_version.outputs.version }}"
          SRC_NAME="XCCTV-TVHelper-src-${VER}.zip"
          zip -r "${SRC_NAME}" . \
            -x "tv/**/*" \
            -x ".git/**/*" \
            -x ".gradle/**/*" \
            -x "app/build/**/*"
          echo "src_zip=${SRC_NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "${SRC_NAME}"

      - name: Upload Source Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCCTV-TVHelper-source
          path: ${{ steps.package_src.outputs.src_zip }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true # 拉取全部远程tag用于判断

      - name: Calculate final tag, avoid duplicate tag
        id: calc_tag
        env:
          BASE_VER: ${{ needs.build.outputs.base_version }}
        run: |
          git fetch --tags
          TAG_BASE="v${BASE_VER}"
          FINAL_TAG="$TAG_BASE"
          BUILD_NUM=1

          # 循环检测tag是否存在，存在就追加 +build序号
          while git rev-parse "refs/tags/$FINAL_TAG" >/dev/null 2>&1; do
            FINAL_TAG="${TAG_BASE}+build${BUILD_NUM}"
            BUILD_NUM=$((BUILD_NUM +1))
          done

          echo "final_tag=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "base_version=$BASE_VER" >> $GITHUB_OUTPUT
          echo "📌 基础版本：$TAG_BASE"
          echo "🏷️ 最终使用tag：$FINAL_TAG"

      - name: Download artifacts (APK + Source Zip)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./release_out
          gh run download "${RUN_ID}" \
            --repo "$REPO" \
            --name "XCCTV-TVHelper-release" \
            --dir ./release_out
          gh run download "${RUN_ID}" \
            --repo "$REPO" \
            --name "XCCTV-TVHelper-source" \
            --dir ./release_out
          ls -lh ./release_out

      - name: Create tag + Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_TAG: ${{ steps.calc_tag.outputs.final_tag }}
          BASE_VERSION: ${{ steps.calc_tag.outputs.base_version }}
        run: |
          TAG="${FINAL_TAG}"
          VERSION="${BASE_VERSION}"
          REPO="${GITHUB_REPOSITORY}"
          APK_NAME="XCCTV-TVHelper-${VERSION}-release.apk"

          APK=$(find ./release_out -name '*.apk' -type f | head -1)
          SRC_ZIP=$(find ./release_out -name '*src-*.zip' -type f | head -1)
          [ -f "$APK" ] || { echo "❌ APK 不存在"; exit 1; }
          [ -f "$SRC_ZIP" ] || { echo "❌ Source Zip 不存在"; exit 1; }

          # 如果文件名不同才重命名（避免 cp 同文件报错）
          if [ "$(basename "$APK")" != "$APK_NAME" ]; then
            mv "$APK" "./release_out/${APK_NAME}"
          fi
          APK_FINAL="./release_out/${APK_NAME}"
          APK_SIZE=$(du -h "$APK_FINAL" | cut -f1)
          SHA256=$(sha256sum "$APK_FINAL" | cut -d' ' -f1)
          echo "📦 APK: $APK_NAME ($APK_SIZE, SHA256=$SHA256)"
          echo "📦 Source: $(basename "$SRC_ZIP")"

          # 创建 tag（仅非 tag 触发时）
          if ! [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "🏷️ 创建 tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          # 先尝试删旧 release（如果存在）
          gh release delete "$TAG" --repo "$REPO" -y 2>/dev/null || true

          # 用模板文件 + envsubst 生成 release notes（避免 heredoc 在 YAML 里的缩进问题）
          echo "📝 生成 release notes..."
          cp .github/release_notes.md /tmp/release_notes.md
          sed -i "s/\${VERSION}/${VERSION}/g" /tmp/release_notes.md
          sed -i "s/\${APK_NAME}/${APK_NAME}/g" /tmp/release_notes.md
          sed -i "s/\${APK_SIZE}/${APK_SIZE}/g" /tmp/release_notes.md
          sed -i "s/\${SHA256}/${SHA256}/g" /tmp/release_notes.md

          echo "🚀 创建 Release $TAG"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "XCCTV TVHelper ${TAG}" \
            --notes-file /tmp/release_notes.md \
            --target "${GITHUB_SHA}" \
            "./release_out/${APK_NAME}#${APK_NAME}" \
            "${SRC_ZIP}#$(basename ${SRC_ZIP})"

          echo "✅ Release $TAG 发布完成"
          echo "🔗 https://github.com/$REPO/releases/tag/$TAG"
