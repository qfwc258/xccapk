name: Build TV助手

# 触发：推送 tvassistant 分支、打 tvassistant-v* 标签、或手动触发
on:
  push:
    branches: [tvassistant]
    tags: ['tvassistant-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages & accept licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

      - name: Grant gradlew exec
        run: chmod +x ./gradlew

      - name: Extract versionName
        id: ver
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' tvassistant/build.gradle | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 TV助手 版本: $VER"

      # ---- 按 ABI 分别构建（复用仓库内置 signing/release.keystore，默认密码 xcctv2026） ----
      - name: Assemble arm64-v8a
        run: ./gradlew :tvassistant:assembleRelease -P ABI_FILTERS=arm64-v8a
      - name: Collect arm64 APK
        run: mkdir -p out && cp tvassistant/build/outputs/apk/release/*.apk out/ 2>/dev/null || true

      - name: Assemble armeabi-v7a
        run: ./gradlew :tvassistant:assembleRelease -P ABI_FILTERS=armeabi-v7a
      - name: Collect armeabi-v7a APK
        run: cp tvassistant/build/outputs/apk/release/*.apk out/ 2>/dev/null || true

      - name: List built APKs
        run: ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TVAssistant-${{ steps.ver.outputs.version }}
          path: out/*.apk
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/tvassistant-v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.ver.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          {
            echo "# TV助手 v${VER}"
            echo ""
            echo "TV 助手 APK（服务端 + 手机网页控制），按架构拆分签名包："
            echo ""
            for f in *.apk; do
              sz=$(du -h "$f" | cut -f1)
              echo "- \`$f\` （$sz）"
            done
            echo ""
            echo "**使用**：安装打开即启动服务端；手机浏览器访问 http://<电视IP>:9091/"
            echo "端口：代理 7890 / 控制 9090(YACD) / 网页 9091；面板密钥默认 zakamihomo"
          } > /tmp/notes.md
          gh release create "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TV助手 v${VER}" \
            --target "${GITHUB_SHA}" \
            --notes-file /tmp/notes.md \
            ./*.apk
          echo "✅ Release $TAG 发布完成：https://github.com/${GITHUB_REPOSITORY}/releases/tag/$TAG"
