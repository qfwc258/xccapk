name: Build APK

on:
  push:
    branches: [main, master, xcctv-tvhelper-src]
    tags: ['v*']
    paths-ignore:
      - 'tv/**' # 忽略 tv 文件夹下所有文件改动，仅tv变更不会触发push构建
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      apk_path: ${{ steps.find_apk.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant gradlew exec
        run: chmod +x ./gradlew

      - name: Extract versionName
        id: extract_version
        run: |
          VER=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "📦 版本: $VER"

      - name: Assemble Release
        run: |
          STK="${{ secrets.RELEASE_STORE_PASSWORD || 'xcctv2026' }}"
          KAL="${{ secrets.RELEASE_KEY_ALIAS || 'xcctv' }}"
          KPW="${{ secrets.RELEASE_KEY_PASSWORD || 'xcctv2026' }}"
          ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=signing/release.keystore \
            -PRELEASE_STORE_PASSWORD="$STK" \
            -PRELEASE_KEY_ALIAS="$KAL" \
            -PRELEASE_KEY_PASSWORD="$KPW"

      - name: List outputs
        run: find app/build/outputs -name '*.apk' -type f -ls

      - name: Find APK path
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCCTV-TVHelper-release
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Create tag + Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          TAG="v${VERSION}"
          REPO="${GITHUB_REPOSITORY}"
          APK_NAME="XCCTV-TVHelper-${VERSION}-release.apk"

          echo "📥 下载 APK artifact..."
          mkdir -p ./apk_out
          gh run download "${GITHUB_RUN_ID}" \
            --repo "$REPO" \
            --name "XCCTV-TVHelper-release" \
            --dir ./apk_out || { echo "❌ 下载 artifact 失败"; exit 1; }

          APK=$(find ./apk_out -name '*.apk' -type f | head -1)
          [ -f "$APK" ] || { echo "❌ APK 不存在"; exit 1; }

          # 如果文件名不同才重命名（避免 cp 同文件报错）
          if [ "$(basename "$APK")" != "$APK_NAME" ]; then
            mv "$APK" "./apk_out/${APK_NAME}"
          fi
          APK_FINAL="./apk_out/${APK_NAME}"
          APK_SIZE=$(du -h "$APK_FINAL" | cut -f1)
          SHA256=$(sha256sum "$APK_FINAL" | cut -d' ' -f1)
          echo "📦 APK: $APK_NAME ($APK_SIZE, SHA256=$SHA256)"

          # 创建 tag（仅非 tag 触发时）
          if ! [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "⏭️ tag $TAG 已存在"
            else
              echo "🏷️ 创建 tag $TAG"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $VERSION"
              git push origin "$TAG"
            fi
          fi

          # 先尝试删旧 release（如果存在）
          gh release delete "$TAG" --repo "$REPO" -y 2>/dev/null || true

          # 用模板文件 + envsubst 生成 release notes（避免 heredoc 在 YAML 里的缩进问题）
          echo "📝 生成 release notes..."
          cp .github/release_notes.md /tmp/release_notes.md
          sed -i "s/\${VERSION}/${VERSION}/g" /tmp/release_notes.md
          sed -i "s/\${APK_NAME}/${APK_NAME}/g" /tmp/release_notes.md
          sed -i "s/\${APK_SIZE}/${APK_SIZE}/g" /tmp/release_notes.md
          sed -i "s/\${SHA256}/${SHA256}/g" /tmp/release_notes.md

          echo "🚀 创建 Release $TAG"
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "XCCTV TVHelper v${VERSION}" \
            --notes-file /tmp/release_notes.md \
            --target "${GITHUB_SHA}" \
            "./apk_out/${APK_NAME}#${APK_NAME}"

          echo "✅ Release $TAG 发布完成"
          echo "🔗 https://github.com/$REPO/releases/tag/$TAG"
