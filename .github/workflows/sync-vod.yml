name: Sync Vod Source

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xccapk
        uses: actions/checkout@v4

      - name: Sync all files from qist/tvbox
        run: |
          rm -rf /tmp/src
          git clone --depth 1 https://github.com/qist/tvbox.git /tmp/src
          # 删除 .git，其余全量复制到当前仓根目录
          rm -rf /tmp/src/.git
          # 同步所有文件（删除本地多余文件）
          rsync -av --delete --exclude='.github' /tmp/src/ ./
          # dianshi.json 改名为 vod.json
          if [ -f dianshi.json ]; then mv dianshi.json tv/vod.json; fi
          if [ -f /tmp/src/dianshi.json ]; then cp /tmp/src/dianshi.json tv/vod.json; fi
          ls -la

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "无更新" || git commit -m "chore: 全量同步 qist/tvbox"
          git push
