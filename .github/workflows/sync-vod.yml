name: Sync Vod Source

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xccapk
        uses: actions/checkout@v4

      - name: Sync all files from qist/tvbox
        run: |
          rm -rf /tmp/src
          git clone --depth 1 https://github.com/qist/tvbox.git /tmp/src
          rm -rf /tmp/src/.git
          # 全量同步（保留 .github）
          rsync -av --delete --exclude='.github' /tmp/src/ ./
          # dianshi.json 复制到 tv/vod.json
          mkdir -p tv
          if [ -f dianshi.json ]; then cp dianshi.json tv/vod.json; fi
          ls -la tv/

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "无更新" || git commit -m "chore: 全量同步 qist/tvbox"
          git push
