name: Sync Vod Source

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0点（北京8点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xccapk
        uses: actions/checkout@v4

      - name: Download dianshi.json from qist/tvbox
        run: |
          mkdir -p /tmp/src
          git clone --depth 1 https://github.com/qist/tvbox.git /tmp/src
          # 查找 dianshi.json（可能在根目录或子目录）
          FILE=$(find /tmp/src -name "dianshi.json" | head -1)
          echo "找到源文件: $FILE"
          if [ -z "$FILE" ]; then echo "未找到 dianshi.json"; exit 1; fi
          cp "$FILE" tv/vod.json

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tv/vod.json
          git diff --staged --quiet && echo "无更新" || git commit -m "chore: 同步 vod.json 自 qist/tvbox/dianshi.json"
          git push
