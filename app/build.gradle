plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.xcctv.tvhelper"
    compileSdk 34

    defaultConfig {
        applicationId "com.xcctv.tvhelper"
        minSdk 21
        targetSdk 34
        versionCode 8
        versionName "1.7"
    }

    def gProp = { key, fallback ->
        def v = project.findProperty(key) ?: fallback
        return v instanceof String ? v.trim() : v
    }

    signingConfigs {
        release {
            def store = rootProject.file(gProp('RELEASE_STORE_FILE', 'signing/release.keystore'))
            if (store.exists()) {
                storeFile store
                storePassword gProp('RELEASE_STORE_PASSWORD', '')
                keyAlias gProp('RELEASE_KEY_ALIAS', 'xcctv')
                keyPassword gProp('RELEASE_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (output.outputFileName) {
                output.outputFileName = "XCCTV-TVHelper-${variant.versionName}-${variant.buildType.name}.apk"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
