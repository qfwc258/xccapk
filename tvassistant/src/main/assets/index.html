<!doctype html>
<html lang=zh>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name=theme-color content="#0e1116">
<title>TV助手 控制端</title>
<style>
:root{--bg:#0e1116;--box:#161b22;--bd:#2a3441;--fg:#e6edf3;--mut:#8b98a5;--grn:#2ea043;--blu:#1f6feb;--red:#b62324;--cy:#58a6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,Segoe UI,Roboto,sans-serif;margin:0 auto;max-width:760px;padding:0 0 24px}
header{padding:14px 16px 8px}
header h1{font-size:19px;margin:0}
header .mut{color:var(--mut);font-size:12px;margin-top:2px}
.tabs{display:flex;gap:6px;padding:0 12px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:8px}
.tab{flex:1;text-align:center;padding:9px 4px;font-size:13px;color:var(--mut);background:var(--box);border:1px solid var(--bd);border-radius:8px}
.tab.on{color:#fff;background:var(--blu);border-color:var(--blu)}
.page{display:none;padding:12px}
.page.on{display:block}
.box{background:var(--box);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
label{display:block;font-size:13px;color:#9fb0c0;margin:10px 0 4px}
textarea,input[type=text],input[type=password]{width:100%;background:#1c2330;color:#fff;border:1px solid var(--bd);border-radius:6px;padding:10px;font-size:14px;font-family:inherit}
button{color:#fff;border:0;border-radius:6px;padding:11px 16px;font-size:15px;cursor:pointer;margin:6px 6px 0 0}
button.sm{padding:6px 12px;font-size:13px;margin:0 0 0 8px}
.b-grn{background:var(--grn)}.b-blu{background:var(--blu)}.b-red{background:var(--red)}.b-ghost{background:#30363d}
code{color:#7ee787;font-size:13px;word-break:break-all}
a{color:var(--cy)}
iframe{width:100%;height:70vh;border:0;border-radius:8px;background:#fff;margin-top:8px}
.mut{color:var(--mut);font-size:12px}
#ov{font-size:14px;line-height:1.7}
#ov b{color:#fff}
.warn{color:#e3b341;font-size:13px;margin-top:6px}
.err{color:#f85149;font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-all}
#srclog,#corelog{white-space:pre-wrap;font-family:monospace;font-size:12px;color:#9fb0c0;max-height:240px;overflow:auto;background:#0b0f14;padding:10px;border-radius:6px}
.bar{height:8px;background:#1c2330;border-radius:4px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--blu);width:0}
/* 小屏（手机）适配：按钮全宽、标签页紧凑、订阅行换行 */
@media (max-width:560px){
  header h1{font-size:17px}
  .tab{font-size:12px;padding:8px 2px}
  button{width:100%;margin:6px 0 0}
  .sub{flex-wrap:wrap}
  .sub .n{width:100%}
  .sub button.sm{margin-top:6px}
  textarea,input[type=text],input[type=password]{font-size:16px}
}
.sub{display:flex;align-items:center;justify-content:space-between;padding:9px 4px;border-bottom:1px solid var(--bd);font-size:14px}
.sub:last-child{border-bottom:0}
.sub .n{flex:1;word-break:break-all}
.sub .n small{display:block;color:var(--mut);font-size:11px;word-break:break-all}
.sub.on .n b{color:var(--grn)}
</style>
</head>
<body>
<header><h1>TV助手 · 控制端</h1><div class=mut>服务端运行于本机，手机同局域网即可控制 <a href=/api/logout onclick="return logout()">登出</a></div></header>

<div class=tabs>
  <div class="tab on" data-p=ov>概览</div>
  <div class="tab" data-p=pr>代理</div>
  <div class="tab" data-p=src>源下载</div>
  <div class="tab" data-p=dash>仪表盘</div>
</div>

<!-- 概览 -->
<div class="page on" id=ov-page>
  <div class=box id=ov>加载中…</div>
  <div class=box>
    <div class=mut>实时连接（每 2 秒刷新）</div>
    <div id=live style="margin-top:6px;font-size:14px;line-height:1.8">等待内核启动…</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
      <button class=b-blu onclick=regroup() style="width:auto;margin:0">重测节点</button>
      <span class=mut>整组测速并自动切换到最快可用节点（约 5 秒）</span>
    </div>
  </div>
  <div class=box>
    <div class=mut>代理连通性测试（经本机 :7890 访问 gstatic 204，验证代理是否真正可用）</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
      <button class=b-blu onclick=proxyTest() style="width:auto;margin:0">测试</button>
      <span id=pt_msg class=mut>未测试</span>
    </div>
  </div>
  <div class=box>
    <div class=mut>内核日志（最近）</div>
    <div id=corelog style="margin-top:8px"></div>
  </div>
</div>

<!-- 代理 -->
<div class=page id=pr-page>
  <div class=box>
    <div class=mut style="margin-bottom:2px">订阅列表（点「使用」一键切换）</div>
    <div id=subs>加载中…</div>
    <label>添加订阅：名称（可选）</label>
    <input id=sub_n type=text placeholder="如 机场A">
    <label>订阅地址（http(s)）</label>
    <input id=sub_u type=text placeholder="https://...">
    <button class=b-blu onclick=subAdd()>添加到列表</button>
    <div id=sub_msg class=mut style="margin-top:6px"></div>
  </div>
  <div class=box>
    <label>临时应用：订阅地址或整段 config.yaml</label>
    <textarea id=pr_sub rows=4 placeholder="留空则不动当前配置"></textarea>
    <label><input id=pr_save type=checkbox style="width:auto;vertical-align:middle;margin-right:6px">应用后存入订阅列表</label>
    <label>控制面板密钥（默认 zakamihomo）</label>
    <input id=pr_secret type=text>
    <label><input id=pr_lan type=checkbox style="width:auto;vertical-align:middle;margin-right:6px">允许局域网代理</label>
    <div style="margin-top:10px">
      <button class=b-grn onclick=proxySave()>保存并应用</button>
      <button class=b-blu onclick=proxyStart()>启动</button>
      <button class=b-red onclick=proxyStop()>停止</button>
      <button class=b-ghost onclick=subRefresh()>更新订阅并重启</button>
    </div>
    <div id=pr_msg class=mut style="margin-top:8px"></div>
  </div>
  <div class=box>
    <div class=mut style="margin-bottom:2px">控制端访问密码</div>
    <label>新密码（设置后其它手机访问需先登录）</label>
    <input id=pass_pw type=password>
    <button class=b-grn onclick=passSet()>设置密码</button>
    <button class=b-ghost onclick=passOff()>关闭密码</button>
    <div id=pass_msg class=mut style="margin-top:6px"></div>
  </div>
  <div class=box>
    <span class=mut>API：</span><code id=pr_api></code><br>
    <a id=pr_ui href="#" target=_blank>在新标签打开仪表盘 ↗</a>
  </div>
</div>

<!-- 源下载 -->
<div class=page id=src-page>
  <div class=box>
    <label>xcctv 源地址（vod.json）</label>
    <input id=src_url type=text>
    <div style="margin-top:10px">
      <button class=b-grn onclick=srcSave()>保存地址</button>
      <button class=b-blu onclick=srcStart()>立即下载</button>
    </div>
    <div id=src_msg class=mut style="margin-top:8px"></div>
  </div>
  <div class=box>
    <div id=src_state class=mut>状态：空闲</div>
    <div class=bar><i id=src_bar></i></div>
    <div id=srclog style="margin-top:10px"></div>
  </div>
</div>

<!-- 仪表盘 -->
<div class=page id=dash-page>
  <div class=box>
    <div class=mut>YACD 代理可视化（从内核 :9090/ui 加载）</div>
    <iframe id=dash_frame src="about:blank"></iframe>
  </div>
</div>

<script>
function post(u,d){return fetch(u,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:d}).then(r=>r.json())}
function get(u){return fetch(u).then(r=>r.json())}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function $(id){return document.getElementById(id)}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));
  t.classList.add('on'); $(''+t.dataset.p+'-page').classList.add('on');
  if(t.dataset.p==='dash') loadDash();
  if(t.dataset.p==='pr') loadSubs();
});

function logout(){ post('/api/logout','').then(()=>location.href='/'); return false; }

function loadInfo(){
  get('/api/info').then(j=>{
    var h =
      '<b>设备：</b>'+esc(j.ip)+'<br>'+
      '<b>网页控制：</b><code>http://'+esc(j.ip)+':'+j.panel+'/</code><br>'+
      '<b>代理内核：</b>'+(j.proxyRunning?'运行中':'已停止')+(j.lan?'（允许局域网）':'')+'<br>';
    if(j.coreErr) h+='<div class=err>✗ '+esc(j.coreErr)+'</div>';
    h+='<b>源下载：</b>'+esc(srcStateText(j.src))+'<br>'+
      '<b>密钥：</b><code>'+esc(j.secret)+'</code><br>'+
      '<b>访问密码：</b>'+(j.hasPass?'已开启':'未设置')+'　<b>当前订阅：</b>'+(j.subCur?esc(j.subCur):'未配置');
    if(!j.storage) h+='<div class=warn>⚠ 存储权限未授予：请在电视上打开 TV助手 按提示授权（源下载需要）</div>';
    $('ov').innerHTML=h;
    $('corelog').textContent=j.coreLog||'（空）';
    $('pr_secret').value=j.secret||'zakamihomo';
    $('pr_lan').checked=!!j.lan;
    $('pr_api').textContent=j.proxyApi||'';
    $('pr_ui').href=j.proxyUi||'#';
    $('src_url').value=j.srcUrl||'';
    renderSrc(j.src);
  }).catch(e=>{ $('ov').textContent='加载失败：'+e; });
}

/* ---------------- 订阅列表 ---------------- */
function loadSubs(){
  get('/api/subs/list').then(j=>{
    var a=j.subs||[], h='';
    if(!a.length) h='<div class=mut>列表为空：先在下方添加订阅地址</div>';
    a.forEach(s=>{
      var on = s.u===j.cur;
      h+='<div class="sub'+(on?' on':'')+'"><span class=n><b>'+(on?'● ':'○ ')+esc(s.n)+'</b>'
        +'<small>'+esc(s.u)+'</small></span>'
        +(on?'':'<button class="sm b-grn" onclick=subUse(\''+esc(s.u)+'\')>使用</button>')
        +'<button class="sm b-red" onclick=subDel(\''+esc(s.u)+'\')>删除</button></div>';
    });
    $('subs').innerHTML=h;
  });
}
function subAdd(){
  post('/api/subs/add','n='+encodeURIComponent($('sub_n').value)+'&u='+encodeURIComponent($('sub_u').value))
    .then(j=>{ $('sub_msg').textContent=j.msg; if(j.ok){$('sub_n').value='';$('sub_u').value='';loadSubs();} });
}
function subUse(u){
  post('/api/subs/use','u='+encodeURIComponent(u))
    .then(j=>{ $('sub_msg').textContent=j.msg; loadSubs(); setTimeout(loadInfo,1500); });
}
function subDel(u){
  post('/api/subs/del','u='+encodeURIComponent(u)).then(j=>{ $('sub_msg').textContent=j.msg; loadSubs(); });
}

/* ---------------- 代理 ---------------- */
function proxySave(){
  var d='sub='+encodeURIComponent($('pr_sub').value)
    +'&secret='+encodeURIComponent($('pr_secret').value)
    +'&lan='+($('pr_lan').checked?1:0)
    +'&save='+($('pr_save').checked?1:0);
  post('/api/proxy/set',d).then(j=>{ $('pr_msg').textContent=j.msg; setTimeout(loadInfo,1200); });
}
function proxyStart(){ post('/api/proxy/start','').then(j=>{ $('pr_msg').textContent=j.msg; loadInfo(); }); }
function proxyStop(){ post('/api/proxy/stop','').then(j=>{ $('pr_msg').textContent=j.msg; loadInfo(); }); }
function subRefresh(){ $('pr_msg').textContent='正在更新订阅…'; post('/api/subs/refresh','').then(j=>{ $('pr_msg').textContent=j.msg; setTimeout(loadInfo,3000); }); }
function proxyTest(){
  $('pt_msg').textContent='测试中…（最长约 12 秒）';
  get('/api/proxytest').then(j=>{ $('pt_msg').textContent=j.msg; $('pt_msg').style.color=j.ok?'var(--grn)':'var(--red)'; });
}

/* ---------------- 实时连接 ---------------- */
var lastUp=0,lastDown=0,lastT=0;
function fmtSpeed(b){ b=Math.max(0,b||0); return b>=1048576?(b/1048576).toFixed(2)+' MB/s':b>=1024?(b/1024).toFixed(1)+' KB/s':Math.round(b)+' B/s'; }
function regroup(){
  $('live').innerHTML='<span class=mut>正在整组测速（约 5 秒，请稍候）…</span>';
  post('/api/regroup','').then(j=>{ $('live').innerHTML=j.msg; setTimeout(pollLive,1500); });
}
function pollLive(){
  get('/api/live').then(j=>{
    var now=Date.now(), rate='';
    if(lastT && j.up>=lastUp && j.down>=lastDown){
      var dt=(now-lastT)/1000;
      rate='　<span class=mut>↑</span>'+fmtSpeed((j.up-lastUp)/dt)+'　<span class=mut>↓</span>'+fmtSpeed((j.down-lastDown)/dt);
    }
    lastUp=j.up||0; lastDown=j.down||0; lastT=now;
    if(!j.running){ $('live').innerHTML='<span class=mut>代理未启动</span>'; return; }
    var dl = j.delay>0 ? ' <span class=mut>('+j.delay+'ms)</span>' : '';
    if(!j.conns){ $('live').innerHTML='<b>出口节点：</b>'+esc(j.node||'—')+dl+'（尚无流量）'+rate
      +'<div class=mut style="margin-top:4px">代理已就绪。让手机/播放器把 HTTP 代理指向 <code>电视IP:7890</code> 即会出现连接。</div>'; return; }
    $('live').innerHTML='<b>出口节点：</b><code>'+esc(j.node||'未知')+'</code>'+dl
      +'　<b>活动连接：</b>'+j.conns+rate;
  }).catch(()=>{ $('live').textContent='状态获取失败'; });
}
setInterval(()=>{ if(document.querySelector('.tab.on').dataset.p==='ov') pollLive(); },2000);
function passSet(){
  post('/api/pass/set','pw='+encodeURIComponent($('pass_pw').value))
    .then(j=>{ $('pass_msg').textContent=j.msg; if(j.ok){$('pass_pw').value='';} });
}
function passOff(){ post('/api/pass/off','').then(j=>{ $('pass_msg').textContent=j.msg; }); }

/* ---------------- 源下载 ---------------- */
function srcStateText(s){
  if(!s) return '空闲';
  if(s.status==='downloading') return '下载中 '+s.current+'/'+s.total;
  if(s.status==='done') return '已完成 → '+s.dir;
  if(s.status==='failed') return '失败（见日志）';
  return '空闲';
}
function renderSrc(s){
  if(!s) return;
  $('src_state').textContent = '状态：'+srcStateText(s)+(s.url?'  ('+esc(s.url)+')':'');
  var p = s.total>0 ? Math.round(s.current/s.total*100) : 0;
  $('src_bar').style.width = p+'%';
  $('srclog').textContent = s.log||'';
  $('srclog').scrollTop = 1e9;
}
function srcSave(){
  post('/api/source/set','url='+encodeURIComponent($('src_url').value))
    .then(j=>{ $('src_msg').textContent=j.msg; loadInfo(); });
}
function srcStart(){ post('/api/source/start','').then(j=>{ $('src_msg').textContent=j.msg; pollSrc(); }); }
function pollSrc(){
  get('/api/source/info').then(j=>{ renderSrc(j); if(j.status==='downloading') setTimeout(pollSrc,1000); });
}
function loadDash(){
  get('/api/info').then(j=>{ if(j.proxyUi) $('dash_frame').src=j.proxyUi; });
}

loadInfo();
loadSubs();
pollLive();
setInterval(()=>{ if(document.querySelector('.tab.on').dataset.p==='ov') loadInfo(); },5000);
setInterval(()=>{ if(document.querySelector('.tab.on').dataset.p==='src') pollSrc(); },2000);
</script>
</body>
</html>
