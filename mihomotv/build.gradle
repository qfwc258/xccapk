plugins {
    id 'com.android.application'
}

android {
    namespace "com.zaka.mihomotv"
    compileSdk 34

    defaultConfig {
        applicationId "com.zaka.mihomotv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            // 真实电视都是 ARM；x86_64 仅用于模拟器调试
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    // ---------- 签名：复用仓库 signing/ 下的默认密钥，也支持 -P / 环境变量覆盖 ----------
    def gProp = { key, fallback ->
        def v = project.findProperty(key) ?: fallback
        return v instanceof String ? v.trim() : v
    }
    signingConfigs {
        release {
            storeFile     rootProject.file(gProp('RELEASE_STORE_FILE', 'signing/release.keystore'))
            storePassword gProp('RELEASE_STORE_PASSWORD', 'xcctv2026')
            keyAlias      gProp('RELEASE_KEY_ALIAS', 'xcctv')
            keyPassword   gProp('RELEASE_KEY_PASSWORD', 'xcctv2026')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 内核以 libmihomo.so 形式进 jniLibs，MihomoService 要从 nativeLibraryDir 直接 exec，
    // 因此必须允许系统把 .so 解压到磁盘（targetSdk 34 默认不解压）。
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    // 输出 APK 按 "MihomoTV-v版本-类型.apk" 重命名
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (output.outputFileName) {
                output.outputFileName = "MihomoTV-${variant.versionName}-${variant.buildType.name}.apk"
            }
        }
    }
}
